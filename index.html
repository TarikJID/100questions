<title>100 questions du permis</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout : une colonne d'application, façon panneau autoroutier — bleu route pour la sécurité routière, orange haute visibilité pour les premiers secours. */
:root {
  --bg: #F2F4F8;
  --surface: #FFFFFF;
  --sunk: #E8ECF3;
  --ink: #131A27;
  --muted: #586379;
  --line: #D8DEE8;
  --road: #1A4FA0;
  --road-ink: #FFFFFF;
  --road-soft: #E3EBF8;
  --aid: #C8570A;
  --aid-soft: #FBEADC;
  --ok: #1B7F46;
  --ok-soft: #E0F2E7;
  --ko: #BF2C2C;
  --ko-soft: #F9E2E2;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D121C; --surface: #161D2B; --sunk: #1E2738; --ink: #E6EAF2; --muted: #98A2B6; --line: #2A3448;
    --road: #6F9BE8; --road-ink: #0D121C; --road-soft: #1B2A47; --aid: #F29A50; --aid-soft: #3A2716;
    --ok: #4FC283; --ok-soft: #15301F; --ko: #F07A7A; --ko-soft: #3A1A1D; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D121C; --surface: #161D2B; --sunk: #1E2738; --ink: #E6EAF2; --muted: #98A2B6; --line: #2A3448;
  --road: #6F9BE8; --road-ink: #0D121C; --road-soft: #1B2A47; --aid: #F29A50; --aid-soft: #3A2716;
  --ok: #4FC283; --ok-soft: #15301F; --ko: #F07A7A; --ko-soft: #3A1A1D; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; padding-inline: 16px; padding-block: 20px 48px; }
#app { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: 2.4rem; }
h2 { font-size: 1.6rem; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--road); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.eyebrow { font-family: var(--font-display); font-weight: 600; font-size: .95rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* En-tête */
.masthead { display: flex; align-items: center; gap: 14px; }
.sign { flex: none; display: grid; place-items: center; width: 56px; height: 56px; border-radius: 8px; background: var(--road); color: var(--road-ink); box-shadow: inset 0 0 0 3px var(--road), inset 0 0 0 5px var(--road-ink); font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; }
.masthead .sub { color: var(--muted); }

/* Progression */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.big { font-family: var(--font-display); font-weight: 700; font-size: 3rem; line-height: 1; font-variant-numeric: tabular-nums; }
.big small { font-size: 1.4rem; color: var(--muted); font-weight: 600; }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; }
.bar-row .n { font-variant-numeric: tabular-nums; font-weight: 700; }
.track { grid-column: 1 / -1; height: 10px; border-radius: 5px; background: var(--sunk); overflow: hidden; display: flex; }
.track i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* Modes */
.modes { display: flex; flex-direction: column; gap: 10px; }
.mode { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 14px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.mode:hover { border-color: var(--road); }
.mode .ic { grid-row: span 2; width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; background: var(--road-soft); color: var(--road); }
.mode .ic svg { width: 22px; height: 22px; }
.mode strong { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; }
.mode .d { grid-column: 2; color: var(--muted); font-size: .9rem; }
.mode .go { grid-row: span 2; grid-column: 3; color: var(--muted); }
.mode .count { display: inline-block; margin-left: 8px; padding: 0 8px; border-radius: 99px; background: var(--ko-soft); color: var(--ko); font-family: var(--font-body); font-size: .8rem; font-weight: 700; vertical-align: 3px; }

/* Contrôles */
.field { display: flex; flex-direction: column; gap: 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 14px; font-size: .95rem; }
.seg button[aria-pressed="true"] { background: var(--road); border-color: var(--road); color: var(--road-ink); font-weight: 700; }
.btn { border: 0; border-radius: 8px; padding: 12px 18px; font-weight: 700; background: var(--road); color: var(--road-ink); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.danger { background: var(--ko); color: var(--surface); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.link { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.back { align-self: flex-start; background: none; border: 0; padding: 4px 0; color: var(--muted); font-weight: 700; }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 99px; font-size: .8rem; font-weight: 700; letter-spacing: .02em; }
.chip.sr { background: var(--road-soft); color: var(--road); }
.chip.ps { background: var(--aid-soft); color: var(--aid); }
.chip.plain { background: var(--sunk); color: var(--muted); }
.plate { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 6px; background: var(--road); color: var(--road-ink); font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; }
.plate b { display: grid; place-items: center; min-width: 38px; height: 30px; padding: 0 6px; border-radius: 4px; box-shadow: inset 0 0 0 2px var(--road-ink); font-variant-numeric: tabular-nums; }

/* Quiz */
.qtop { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.qtop .pos { font-variant-numeric: tabular-nums; font-weight: 700; }
.progress { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--road); transition: width .3s; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 16px; border-top: 5px solid var(--road); }
.qcard.ps { border-top-color: var(--aid); }
.qtext { font-family: var(--font-display); font-weight: 600; font-size: 1.6rem; line-height: 1.2; text-wrap: balance; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; text-align: left; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); }
.opt:not([disabled]):hover { border-color: var(--road); }
.opt .k { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; background: var(--sunk); font-weight: 700; font-size: .85rem; }
.opt .tag { display: block; margin-top: 4px; font-size: .75rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .k { background: var(--ok); color: var(--surface); }
.opt.right .tag { color: var(--ok); }
.opt.wrong { border-color: var(--ko); background: var(--ko-soft); }
.opt.wrong .k { background: var(--ko); color: var(--surface); }
.opt.wrong .tag { color: var(--ko); }
.opt[disabled] { cursor: default; }
.opt.dim { opacity: .55; }
.verdict { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; }
.verdict.ok { color: var(--ok); }
.verdict.ko { color: var(--ko); }
.official { border-left: 4px solid var(--ok); background: var(--ok-soft); padding: 12px 14px; border-radius: 0 8px 8px 0; }
.official .eyebrow { color: var(--ok); }
.note { font-size: .9rem; color: var(--muted); border-left: 3px solid var(--line); padding-left: 12px; }
.hint { font-size: .8rem; color: var(--muted); }

/* Résultats */
.score { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.misses { display: flex; flex-direction: column; gap: 12px; }
.miss { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.miss .a { color: var(--ok); font-weight: 700; }

/* Fiches */
.search { width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; }
.fiches { display: flex; flex-direction: column; gap: 12px; }
.fiche { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.fiche-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.qa { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; }
.qa .dot { margin-top: 7px; }
.qa .q { font-weight: 700; }
.qa .lab { font-size: .75rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.qa .lab.sr { color: var(--road); }
.qa .lab.ps { color: var(--aid); }
.qa .ans { grid-column: 2; color: var(--muted); }
.qa .ans.hidden-ans { color: transparent; background: var(--sunk); border-radius: 4px; user-select: none; cursor: pointer; }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line); background: transparent; flex: none; }
.dot.learning { border-color: var(--road); background: var(--road-soft); }
.dot.mastered { border-color: var(--ok); background: var(--ok); }
.dot.review { border-color: var(--ko); background: var(--ko); }
.empty { text-align: center; padding: 28px 16px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.confirm { background: var(--ko-soft); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
@media (max-width: 420px) {
  h1 { font-size: 2rem; }
  .qtext { font-size: 1.4rem; }
  .qcard { padding: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
/* ---------- Données : réponses officielles + distracteurs rédigés ---------- */
// [question, réponse officielle, [mauvaises réponses], note éventuelle]
const SR = {
s01:["Pourquoi doit-on régler la hauteur des feux ?","Pour ne pas éblouir les autres usagers",["Pour économiser la batterie du véhicule","Pour mieux voir les panneaux situés en hauteur","Pour réduire l'usure des ampoules"]],
s02:["Pourquoi est-il préférable d'utiliser un liquide lave-glace spécial en hiver ?","Pour éviter le gel du liquide",["Pour dégivrer plus vite les rétroviseurs","Pour protéger la peinture du sel de déneigement","Pour réduire la consommation de carburant"]],
s03:["Quel est l'intérêt de la position nuit du rétroviseur ?","Ne pas être ébloui par les feux du véhicule suiveur",["Mieux voir les angles morts la nuit","Éclairer l'habitacle pour lire une carte","Voir plus loin derrière le véhicule dans l'obscurité"]],
s04:["Citez un endroit où l'on peut trouver les pressions préconisées pour les pneumatiques.","Elles sont indiquées soit sur une plaque sur une portière, soit dans la notice d'utilisation du véhicule, soit au niveau de la trappe à carburant",["Uniquement sur le certificat d'immatriculation du véhicule","Sur la vignette Crit'Air collée sur le pare-brise","Sur le procès-verbal du dernier contrôle technique"]],
s05:["Comment détecter l'usure des essuie-glaces en circulation ?","En cas de pluie, lorsqu'ils laissent des traces sur le pare-brise",["Lorsqu'un voyant s'allume au tableau de bord","Par temps sec, lorsqu'ils balaient plus lentement","Lorsque le liquide lave-glace se vide plus vite"]],
s06:["Quelles sont les précautions à prendre en cas d'installation d'un porte-vélo ?","La plaque d'immatriculation et les feux doivent être visibles",["Les vélos doivent être couverts d'une bâche","Il faut le déclarer à son assureur avant chaque trajet","La vitesse est limitée à 70 km/h sur autoroute"]],
s07:["En cas de panne ou d'accident, quel autre accessoire de sécurité est obligatoire ? (Autre que le gilet de haute visibilité)","Le triangle de pré-signalisation",["L'extincteur","La trousse de premiers secours","La lampe torche"]],
s08:["Quelle est la conséquence d'un niveau insuffisant du liquide de frein ?","Une perte d'efficacité du freinage",["Une surchauffe du moteur","Une usure plus rapide des pneumatiques","Un blocage de la direction"]],
s09:["Quels sont les deux autres documents obligatoires à présenter en cas de contrôle par les forces de l'ordre ? (Autre que la carte grise)","L'attestation d'assurance et le permis de conduire",["Le carnet d'entretien et le permis de conduire","Le procès-verbal du contrôle technique et la carte d'identité","L'attestation d'assurance et le constat amiable"]],
s10:["Quel est le risque de circuler avec des balais d'essuie-glace défectueux ?","Une mauvaise visibilité en cas d'intempéries",["Une surconsommation de liquide de refroidissement","Une décharge rapide de la batterie","Une rayure systématique des phares"]],
s11:["Quelles sont les précautions à prendre lors du remplissage du réservoir de carburant ?","Arrêter le moteur, ne pas fumer, ne pas téléphoner",["Allumer les feux de détresse et laisser tourner le moteur","Ouvrir toutes les fenêtres et couper la radio","Remplir jusqu'à ce que le carburant déborde légèrement"]],
s12:["Quel est le danger si l'on complète le niveau du liquide de refroidissement lorsque le moteur est chaud ?","Un risque de brûlure",["Un risque de gel du circuit","Un risque de panne de batterie","Un risque d'éblouissement"]],
s13:["Quelle peut être la conséquence d'une panne de dégivrage de la lunette arrière ?","Une insuffisance ou une absence de visibilité vers l'arrière",["Une surchauffe du moteur","Un mauvais fonctionnement des feux de recul","Une décharge immédiate de la batterie"]],
s14:["Quelle est la signification d'un clignotement plus rapide ?","Non-fonctionnement de l'une des ampoules",["Les feux de détresse sont activés","Le réservoir de carburant est presque vide","Le régulateur de vitesse est enclenché"]],
s15:["Quelles sont les conditions à respecter pour contrôler le niveau d'huile ?","Moteur froid et sur un terrain plat",["Moteur chaud et véhicule en pente","Moteur en marche et frein à main serré","Moteur chaud, juste après un long trajet"]],
s16:["Dans quels cas utilise-t-on les feux de brouillard arrière ?","Par temps de brouillard et neige",["Par forte pluie","La nuit, sur route non éclairée","Dès que la visibilité baisse au crépuscule"]],
s17:["À partir de quel taux d'alcoolémie, en période de permis probatoire, est-on en infraction ?","0,2 g/l, c'est-à-dire 0 verre, car dès le 1er verre ce seuil peut être dépassé",["0,5 g/l, c'est-à-dire environ 2 verres","0,8 g/l, comme pour tous les conducteurs","0,3 g/l, c'est-à-dire 1 verre au maximum"]],
s18:["Dans quels cas doit-on utiliser les feux de détresse ?","En cas de panne, d'accident ou de ralentissement important",["Pour remercier un autre usager","Pour stationner quelques minutes en double file","Par temps de brouillard, à la place des feux de brouillard"]],
s19:["Pourquoi est-il important de bien régler son volant ? Citez deux exemples.","Le confort de conduite. L'accessibilité aux commandes. La visibilité du tableau de bord. L'efficacité des airbags",["Réduire la consommation de carburant. Limiter l'usure des pneus","Faciliter le stationnement. Améliorer la puissance du moteur","Diminuer le bruit dans l'habitacle. Protéger la direction assistée"]],
s20:["Citez un cas d'utilisation de l'appel lumineux.","Pour avertir de son approche. En cas de danger. À la place de l'avertisseur sonore",["Pour demander à un véhicule de céder le passage","Pour remercier un autre conducteur","Pour signaler la présence d'un contrôle de police"]],
s21:["Citez deux éléments complémentaires permettant un désembuage efficace.","La commande de vitesse de ventilation. La commande d'air chaud. La climatisation",["Le recyclage de l'air. Les feux de brouillard","L'essuie-glace arrière. Le lave-glace","L'ouverture du toit ouvrant. Le chauffage des sièges"]],
s22:["Quel est le principal risque d'un manque d'huile moteur ?","Un risque de détérioration ou de casse du moteur",["Un risque de crevaison","Une perte d'efficacité de l'éclairage","Un blocage des essuie-glaces"]],
s23:["Qu'est-ce qui peut provoquer la décharge de la batterie, moteur éteint ?","Les feux ou accessoires électriques en fonctionnement",["Un niveau d'huile trop bas","Des pneus sous-gonflés","Un réservoir de carburant presque vide"]],
s24:["Quelle est la solution en cas de panne de batterie pour démarrer le véhicule sans le déplacer ?","Brancher une deuxième batterie en parallèle (les « + » ensemble et les « − » ensemble) ou la remplacer",["Brancher une deuxième batterie en croisant les câbles (le « + » sur le « − »)","Laisser le contact mis quelques minutes pour qu'elle se recharge","Ajouter de l'eau du robinet dans la batterie"]],
s25:["Quel est le risque de circuler avec un frein de parking mal desserré ?","Une dégradation du système de freinage",["Une crevaison immédiate","Une décharge de la batterie","Un éblouissement des autres usagers"]],
s26:["Quelles sont les conséquences d'un mauvais réglage des feux de croisement ?","Une mauvaise vision vers l'avant et un risque d'éblouissement des autres usagers",["Une surconsommation de carburant","Une usure prématurée de la batterie","Un mauvais fonctionnement des clignotants"]],
s27:["Quelle est la conséquence d'une température trop élevée du liquide de refroidissement ?","Une surchauffe ou une casse moteur",["Une perte d'efficacité du freinage","Le gel du circuit de refroidissement","Une décharge de la batterie"]],
s28:["Quelle est l'utilité des dispositifs réfléchissants ?","Rendre visible le véhicule la nuit",["Éclairer la route en cas de panne des phares","Réduire l'éblouissement des autres usagers","Signaler un freinage d'urgence"]],
s29:["Quelle précaution dois-je prendre pour que les enfants installés à l'arrière ne puissent pas ouvrir leur portière ?","Actionner la sécurité enfant sur les deux portières arrière",["Verrouiller les portes avec la clé depuis l'extérieur","Désactiver l'airbag passager","Activer les feux de détresse"]],
s30:["Par temps clair, à quelle distance les feux de position doivent-ils être visibles ?","À 150 mètres",["À 30 mètres","À 50 mètres","À 300 mètres"]],
s32:["Qu'est-ce que l'aquaplanage et quelle peut être sa conséquence ?","La présence d'un film d'eau entre le pneumatique et la chaussée pouvant entraîner une perte de contrôle du véhicule",["Une projection d'eau sur le pare-brise pouvant entraîner une perte de visibilité","Une infiltration d'eau dans le moteur pouvant entraîner une panne","Un dépôt de givre sur la chaussée pouvant entraîner un dérapage"]],
s33:["Sans actionner la commande du régulateur, comment le désactiver rapidement ?","En appuyant sur la pédale de frein ou d'embrayage",["En appuyant fortement sur l'accélérateur","En tournant brusquement le volant","En coupant le contact"]],
s35:["Dans quel cas peut-on utiliser l'avertisseur sonore en agglomération ?","En cas de danger immédiat",["Pour avertir de son approche dans un virage","Pour saluer un autre usager","Pour demander à un véhicule lent d'accélérer"]],
s37:["Dans quelle situation doit-on désactiver l'airbag passager ?","Lors du transport d'un enfant à l'avant dans un siège auto, dos à la route",["Lors du transport d'un adulte de plus de 1,80 m","Lorsque le siège passager est vide","Lors d'un trajet sur autoroute"]],
s38:["À quelle fréquence est-il préconisé de vérifier la pression des pneus ?","Chaque mois, pour une utilisation normale de son véhicule, et avant chaque long trajet",["Une fois par an, lors de la révision","Uniquement lors du contrôle technique","Tous les 20 000 km"]],
s39:["En règle générale, à partir de quel âge un enfant peut-il être installé sur le siège passager avant du véhicule ?","10 ans",["6 ans","8 ans","14 ans"]],
s40:["Un défaut d'éclairage de la plaque d'immatriculation lors du contrôle technique entraîne-t-il une contre-visite ?","Oui",["Non","Non, seulement un avertissement sur le procès-verbal","Uniquement si le véhicule a plus de 10 ans"]],
s41:["Quels sont les deux autres documents obligatoires à présenter en cas de contrôle par les forces de l'ordre ? (Autre que l'attestation d'assurance du véhicule)","Le certificat d'immatriculation et le permis de conduire",["Le carnet d'entretien et le permis de conduire","La carte d'identité et le certificat d'immatriculation","Le procès-verbal du contrôle technique et le permis de conduire"]],
s42:["Si la sécurité enfant est enclenchée, est-il possible d'ouvrir la portière arrière depuis l'extérieur ?","Oui",["Non","Non, seulement avec la clé","Uniquement si le moteur est coupé"]],

/* ---------- État de l'écran ---------- */
let view = "home";
let train = { cat: "all", verif: "all", count: 10 };
let session = null;     // { kind, items:[id], i, opts, picked, revealed, answers:[{id, ok}], fiche }
let browse = { text: "", verif: "all", hide: false };
let confirmReset = false;

function go(v) { view = v; confirmReset = false; render(); window.scrollTo(0, 0); }

/* ---------- Accueil ---------- */
function renderHome() {
  const byCat = cat => {
    const ids = IDS.filter(id => Q[id].cat === cat);
    const c = { mastered: 0, learning: 0, review: 0, new: 0 };
    ids.forEach(id => c[level(id)]++);
    return { total: ids.length, ...c };
  };
  const sr = byCat("sr"), ps = byCat("ps");
  const mastered = sr.mastered + ps.mastered, total = sr.total + ps.total;
  const errCount = IDS.filter(id => stat(id).err).length;
  const bar = (label, c, color) => `
    <div class="bar-row">
      <span>${label}</span><span class="n">${c.mastered} / ${c.total}</span>
      <div class="track" role="img" aria-label="${label} : ${c.mastered} maîtrisées, ${c.learning} en cours, ${c.review} à revoir sur ${c.total}">
        <i style="width:${c.mastered / c.total * 100}%;background:var(--ok)"></i>
        <i style="width:${c.learning / c.total * 100}%;background:${color}"></i>
        <i style="width:${c.review / c.total * 100}%;background:var(--ko)"></i>
      </div>
    </div>`;
  return `
  <header class="masthead">
    <div class="sign" aria-hidden="true">100</div>
    <div><h1>100 questions du permis</h1><p class="sub">Interrogation orale du permis B : sécurité routière et premiers secours</p></div>
  </header>

  <section class="panel" aria-labelledby="prog">
    <span class="eyebrow" id="prog">Ta progression</span>
    <div class="big">${mastered}<small> / ${total} questions maîtrisées</small></div>
    <div class="bars">${bar("Sécurité routière", sr, "var(--road)")}${bar("Premiers secours", ps, "var(--aid)")}</div>
    <div class="legend small muted">
      <span><i class="dot mastered"></i>Maîtrisée</span><span><i class="dot learning"></i>En cours</span><span><i class="dot review"></i>À revoir</span>
    </div>
    <p class="small muted">Une question est maîtrisée après deux bonnes réponses d'affilée. Les 100 fiches se recoupent : elles contiennent ${total} questions différentes.</p>
  </section>

  <nav class="modes" aria-label="Modes de jeu">
    ${modeBtn("sim", "exam", "Simulation d'examen", "Une fiche au hasard, comme le jour J : une question de sécurité routière, puis une de premiers secours.")}
    ${modeBtn("train", "train", "Entraînement libre", "Une série de questions, filtrée par catégorie ou par type de vérification.")}
    ${modeBtn("errors", "errors", `Révision des erreurs${errCount ? `<span class="count">${errCount}</span>` : ""}`, errCount ? "Les questions ratées reviennent jusqu'à deux bonnes réponses d'affilée." : "Aucune erreur à revoir pour l'instant.")}
    ${modeBtn("browse", "browse", "Parcourir les fiches", "Les 100 fiches en lecture, avec une recherche.")}
  </nav>

  <section class="panel">
    <div class="field">
      <span class="eyebrow" id="lbl-mode">Façon de répondre</span>
      <div class="seg" role="group" aria-labelledby="lbl-mode">
        ${seg("answer", "qcm", "QCM", store.mode)}${seg("answer", "oral", "Oral (sans propositions)", store.mode)}
      </div>
      <p class="small muted">${store.mode === "qcm" ? "Tu choisis parmi 4 propositions." : "Tu formules la réponse dans ta tête, tu la révèles, puis tu dis si tu la savais. C'est plus proche de l'examen."}</p>
    </div>
    ${confirmReset ? `
      <div class="confirm">
        <p>Effacer toute ta progression ? Cette action est définitive.</p>
        <div class="row"><button class="btn danger" data-act="reset-yes" id="reset-yes">Effacer</button><button class="btn ghost" data-act="reset-no" id="reset-no">Annuler</button></div>
      </div>` : `<button class="link small" data-act="reset" id="reset">Remettre la progression à zéro</button>`}
  </section>`;
}
const modeBtn = (act, icon, title, desc) => `
  <button class="mode" data-act="${act}" id="mode-${act}">
    <span class="ic" aria-hidden="true">${ICONS[icon]}</span>
    <strong>${title}</strong>
    <span class="d">${desc}</span>
    <span class="go" aria-hidden="true">›</span>
  </button>`;
const seg = (group, value, label, current) => `<button data-act="seg" data-group="${group}" data-value="${value}" aria-pressed="${String(value) === String(current)}">${label}</button>`;

/* ---------- Entraînement : réglages ---------- */
function trainPool() {
  return IDS.filter(id => (train.cat === "all" || Q[id].cat === train.cat) && (train.verif === "all" || Q[id].verifs.has(train.verif)));
}
function renderTrain() {
  const pool = trainPool();
  const n = train.count === "all" ? pool.length : Math.min(train.count, pool.length);
  return `
  <button class="back" data-act="home">‹ Accueil</button>
  <h2>Entraînement libre</h2>
  <section class="panel">
    <div class="field"><span class="eyebrow" id="l-cat">Catégorie</span><div class="seg" role="group" aria-labelledby="l-cat">
      ${seg("cat", "all", "Toutes", train.cat)}${seg("cat", "sr", "Sécurité routière", train.cat)}${seg("cat", "ps", "Premiers secours", train.cat)}</div></div>
    <div class="field"><span class="eyebrow" id="l-verif">Vérification</span><div class="seg" role="group" aria-labelledby="l-verif">
      ${seg("verif", "all", "Toutes", train.verif)}${seg("verif", "int", "Intérieure", train.verif)}${seg("verif", "ext", "Extérieure", train.verif)}</div></div>
    <div class="field"><span class="eyebrow" id="l-count">Nombre de questions</span><div class="seg" role="group" aria-labelledby="l-count">
      ${seg("count", 10, "10", train.count)}${seg("count", 20, "20", train.count)}${seg("count", "all", `Toutes (${pool.length})`, train.count)}</div></div>
    <p class="small muted">Les questions que tu maîtrises le moins passent en premier.</p>
    <div class="row"><button class="btn" data-act="start-train" id="start-train">Commencer : ${n} question${n > 1 ? "s" : ""}</button></div>
  </section>`;
}
function startTrain() {
  const rank = { review: 0, new: 1, learning: 2, mastered: 3 };
  let pool = shuffle(trainPool()).sort((a, b) => rank[level(a)] - rank[level(b)]);
  if (train.count !== "all") pool = pool.slice(0, train.count);
  startSession("train", shuffle(pool));
}
function startErrors(ids) {
  const items = ids || IDS.filter(id => stat(id).err);
  if (!items.length) { go("errors-empty"); return; }
  startSession("errors", shuffle(items));
}
function startSim() {
  const f = FICHES[Math.floor(Math.random() * FICHES.length)];
  startSession("sim", [f.sr, f.ps], f);
}
function startSession(kind, items, fiche) {
  session = { kind, items, i: 0, answers: [], fiche, mode: store.mode };
  prepQuestion();
  go("quiz");
}
function prepQuestion() {
  const q = Q[session.items[session.i]];
  session.opts = shuffle([q.a, ...q.d]);
  session.picked = null;
  session.revealed = false;
}

/* ---------- Écran de question ---------- */
function renderQuiz() {
  const s = session, q = Q[s.items[s.i]], total = s.items.length, done = s.picked !== null;
  const title = s.kind === "sim" ? "Simulation d'examen" : s.kind === "errors" ? "Révision des erreurs" : "Entraînement libre";
  let body;
  if (s.mode === "qcm") {
    body = `<div class="opts" role="group" aria-label="Propositions">
      ${s.opts.map((o, k) => {
        const isRight = o === q.a, isPicked = s.picked === k;
        const cls = done ? (isRight ? "right" : isPicked ? "wrong" : "dim") : "";
        const tag = done && isRight ? `<span class="tag">Réponse officielle</span>` : done && isPicked ? `<span class="tag">Ta réponse</span>` : "";
        return `<button class="opt ${cls}" data-act="pick" data-k="${k}" ${done ? "disabled" : ""}><span class="k">${"ABCD"[k]}</span><span>${esc(o)}${tag}</span></button>`;
      }).join("")}
    </div>`;
  } else {
    body = !s.revealed
      ? `<p class="muted">Formule ta réponse à voix haute ou dans ta tête, puis révèle la réponse officielle.</p>
         <div class="row"><button class="btn" data-act="reveal" id="reveal">Voir la réponse</button></div>`
      : `<div class="official"><span class="eyebrow">Réponse officielle</span><p>${esc(q.a)}</p></div>
         ${done ? "" : `<div class="row"><button class="btn" data-act="self" data-ok="1" id="self-ok">Je savais</button><button class="btn ghost" data-act="self" data-ok="0" id="self-ko">Je ne savais pas</button></div>`}`;
  }
  const last = s.i === total - 1;
  const ok = done && s.answers[s.answers.length - 1].ok;
  const feedback = done ? `
    <p class="verdict ${ok ? "ok" : "ko"}">${s.mode === "qcm" ? (ok ? "Bonne réponse" : "Mauvaise réponse") : (ok ? "Notée comme sue" : "Notée à revoir")}</p>
    ${q.note ? `<p class="note">${esc(q.note)}</p>` : ""}
    ${q.missingIn36 && s.fiche && s.fiche.n === 36 ? `<p class="note">Dans le PDF, l'intitulé de cette question manque sur la fiche 36 ; il est repris de la fiche 60, qui a la même réponse.</p>` : ""}
    <div class="row"><button class="btn" data-act="next" id="next">${last ? "Voir le résultat" : "Question suivante"}</button></div>` : "";
  const head = s.kind === "sim"
    ? `<span class="plate"><b>${pad(s.fiche.n)}</b>${VERIF[s.fiche.verif]}</span>`
    : `<span class="chip plain">${fichesLabel(q)}</span>`;
  return `
  <div class="qtop"><button class="back" data-act="quit">‹ Quitter</button><span class="small muted">${title}</span><span class="pos">${s.i + 1} / ${total}</span></div>
  <div class="progress" aria-hidden="true"><i style="width:${(s.i + (done ? 1 : 0)) / total * 100}%"></i></div>
  ${s.kind === "sim" ? `<div>${head}</div>` : ""}
  <article class="qcard ${q.cat}">
    <div class="chips"><span class="chip ${q.cat}">${CAT[q.cat]}</span>${s.kind === "sim" ? "" : head}</div>
    <p class="qtext">${esc(q.q)}</p>
    ${body}
    ${feedback}
  </article>
  ${s.mode === "qcm" && !done ? `<p class="hint">Raccourcis : touches 1 à 4 pour répondre, Entrée pour continuer.</p>` : ""}`;
}
function answer(ok, picked) {
  const s = session, id = s.items[s.i];
  s.picked = picked;
  s.answers.push({ id, ok });
  record(id, ok);
  render();
  const n = document.getElementById("next"); if (n) n.focus({ preventScroll: true });
}
function next() {
  if (session.i < session.items.length - 1) { session.i++; prepQuestion(); render(); window.scrollTo(0, 0); }
  else go("result");
}

/* ---------- Résultat ---------- */
function renderResult() {
  const s = session, good = s.answers.filter(a => a.ok).length, total = s.answers.length;
  const missed = s.answers.filter(a => !a.ok).map(a => Q[a.id]);
  const pct = Math.round(good / total * 100);
  const msg = s.kind === "sim"
    ? (good === 2 ? "Fiche réussie. Tu aurais obtenu les points de ces deux questions." : good === 1 ? "Une seule question réussie sur cette fiche." : "Aucune question réussie sur cette fiche.")
    : pct === 100 ? "Sans faute." : pct >= 70 ? "Bon résultat. Revois les questions ratées ci-dessous." : "Continue : les questions ratées reviendront dans « Révision des erreurs ».";
  const again = s.kind === "sim" ? "Nouvelle fiche" : s.kind === "errors" ? "Relancer la révision" : "Nouvelle série";
  return `
  <button class="back" data-act="home">‹ Accueil</button>
  <section class="panel">
    <span class="eyebrow">${s.kind === "sim" ? `Fiche ${pad(s.fiche.n)} · ${VERIF[s.fiche.verif]}` : "Résultat de la série"}</span>
    <div class="score"><span class="big">${good}<small> / ${total}</small></span></div>
    <p>${msg}</p>
    ${s.kind === "sim" ? `<p class="small muted">Le jour de l'examen, la vérification du véhicule elle-même est aussi évaluée. Elle n'est pas couverte ici.</p>` : ""}
    <div class="row">
      ${missed.length ? `<button class="btn" data-act="retry-missed" id="retry-missed">Revoir mes erreurs (${missed.length})</button>` : ""}
      <button class="btn ${missed.length ? "ghost" : ""}" data-act="again" id="again">${again}</button>
    </div>
  </section>
  ${missed.length ? `<h2>À retenir</h2><div class="misses">${missed.map(q => `
    <div class="miss"><div class="chips"><span class="chip ${q.cat}">${CAT[q.cat]}</span><span class="chip plain">${fichesLabel(q)}</span></div>
      <p><strong>${esc(q.q)}</strong></p><p class="a">${esc(q.a)}</p>${q.note ? `<p class="note">${esc(q.note)}</p>` : ""}</div>`).join("")}</div>` : ""}`;
}

/* ---------- Pas d'erreurs ---------- */
function renderErrorsEmpty() {
  return `
  <button class="back" data-act="home">‹ Accueil</button>
  <section class="panel empty">
    <h2>Aucune erreur à revoir</h2>
    <p class="muted">Les questions que tu rates en simulation ou en entraînement s'ajoutent ici. Elles en sortent après deux bonnes réponses d'affilée.</p>
    <button class="btn" data-act="train">Lancer un entraînement</button>
  </section>`;
}

/* ---------- Parcourir ---------- */
function norm(s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
function renderBrowse() {
  const t = norm(browse.text.trim());
  const list = FICHES.filter(f => (browse.verif === "all" || f.verif === browse.verif) &&
    (!t || String(f.n) === t.replace(/^0+/, "") || [f.sr, f.ps].some(id => norm(Q[id].q + " " + Q[id].a).includes(t))));
  const qa = id => {
    const q = Q[id], lv = level(id);
    return `<div class="qa">
      <i class="dot ${lv}" title="${LEVEL_LABEL[lv]}" aria-label="${LEVEL_LABEL[lv]}"></i>
      <div><span class="lab ${q.cat}">${CAT[q.cat]}</span><p class="q">${esc(q.q)}</p></div>
      <p class="ans ${browse.hide ? "hidden-ans" : ""}" ${browse.hide ? 'data-act="peek" title="Toucher pour afficher"' : ""}>${esc(q.a)}</p>
    </div>`;
  };
  return `
  <button class="back" data-act="home">‹ Accueil</button>
  <h2>Les 100 fiches</h2>
  <input class="search" id="search" type="search" placeholder="Rechercher un mot ou un numéro de fiche" value="${esc(browse.text)}" aria-label="Rechercher dans les fiches">
  <div class="row">
    <div class="seg" role="group" aria-label="Vérification">${seg("bverif", "all", "Toutes", browse.verif)}${seg("bverif", "int", "Intérieures", browse.verif)}${seg("bverif", "ext", "Extérieures", browse.verif)}</div>
    <div class="seg"><button data-act="hide" aria-pressed="${browse.hide}" id="hide">Masquer les réponses</button></div>
  </div>
  <p class="small muted" id="bcount">${list.length} fiche${list.length > 1 ? "s" : ""}</p>
  <div class="fiches" id="fiches">${list.map(f => `
    <article class="fiche">
      <div class="fiche-head"><span class="plate"><b>${pad(f.n)}</b>${VERIF[f.verif]}</span></div>
      ${qa(f.sr)}${qa(f.ps)}
      ${f.n === 36 ? `<p class="note">L'intitulé de la question de premiers secours manque dans le PDF pour cette fiche ; il est repris de la fiche 60, qui a la même réponse.</p>` : ""}
    </article>`).join("") || `<p class="muted">Aucune fiche ne correspond à cette recherche.</p>`}</div>`;
}

/* ---------- Rendu et événements ---------- */
function render() {
  $app.innerHTML =
    view === "home" ? renderHome() :
    view === "train" ? renderTrain() :
    view === "quiz" ? renderQuiz() :
    view === "result" ? renderResult() :
    view === "errors-empty" ? renderErrorsEmpty() :
    view === "browse" ? renderBrowse() : renderHome();
}

$app.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act;
  switch (act) {
    case "home": go("home"); break;
    case "sim": startSim(); break;
    case "train": go("train"); break;
    case "errors": startErrors(); break;
    case "browse": go("browse"); break;
    case "quit": go("home"); break;
    case "seg": {
      const g = el.dataset.group, raw = el.dataset.value, v = /^\d+$/.test(raw) ? +raw : raw;
      if (g === "answer") { store.mode = v; save(); }
      else if (g === "bverif") browse.verif = v;
      else train[g] = v;
      render(); break;
    }
    case "start-train": startTrain(); break;
    case "pick": if (session.picked === null) { const k = +el.dataset.k; answer(session.opts[k] === Q[session.items[session.i]].a, k); } break;
    case "reveal": session.revealed = true; render(); { const b = document.getElementById("self-ok"); if (b) b.focus({ preventScroll: true }); } break;
    case "self": if (session.picked === null) answer(el.dataset.ok === "1", -1); break;
    case "next": next(); break;
    case "retry-missed": startErrors(session.answers.filter(a => !a.ok).map(a => a.id)); break;
    case "again": session.kind === "sim" ? startSim() : session.kind === "errors" ? startErrors() : startTrain(); break;
    case "hide": browse.hide = !browse.hide; render(); break;
    case "peek": el.classList.remove("hidden-ans"); el.removeAttribute("data-act"); break;
    case "reset": confirmReset = true; render(); document.getElementById("reset-no").focus(); break;
    case "reset-no": confirmReset = false; render(); break;
    case "reset-yes": store.q = {}; save(); confirmReset = false; render(); break;
  }
});

$app.addEventListener("input", e => {
  if (e.target.id !== "search") return;
  browse.text = e.target.value;
  const pos = e.target.selectionStart;
  render();
  const s = document.getElementById("search"); s.focus(); try { s.setSelectionRange(pos, pos); } catch (err) {}
});

document.addEventListener("keydown", e => {
  if (view !== "quiz" || !session || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.tagName === "INPUT") return;
  const done = session.picked !== null;
  if (!done && session.mode === "qcm") {
    const k = "1234".indexOf(e.key) >= 0 ? "1234".indexOf(e.key) : "abcd".indexOf(e.key.toLowerCase());
    if (k >= 0 && e.key.length === 1) { e.preventDefault(); answer(session.opts[k] === Q[session.items[session.i]].a, k); }
  } else if (done && e.key === "Enter" && !e.target.closest("button")) { e.preventDefault(); next(); }
});

function boot(data) {
  if (data && data.view) { view = data.view; session = data.session || null; train = data.train || train; browse = data.browse || browse; }
  if ((view === "quiz" || view === "result") && !session) view = "home";
  render();
}
try { window.claude?.hot?.snapshot?.(() => ({ view, session, train, browse })); } catch (e) {}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
